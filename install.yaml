# Details about the install.yaml file are at https://ddev.readthedocs.io/en/stable/users/extend/additional-services/#sections-and-features-of-ddev-get-add-on-installyaml

name: of-sw

# list of files and directories listed that are copied into project .ddev directory
# Each file should contain #ddev-generated so it can be replaced by a later `ddev add-on get`
# if it hasn't been modified by the user.
project_files:
  - .env.adminer
  - config.watch.yaml
  - mysql/my.cnf
  - php/shopware.ini
  - commands/.gitattributes
  - commands/host/hip
  - commands/web/ab
  - commands/web/abf
  - commands/web/aw
  - commands/web/bc
  - commands/web/cc
  - commands/web/cca
  - commands/web/cli
  - commands/web/ip
  - commands/web/sb
  - commands/web/sbf
  - commands/web/sw

# Version constraint for DDEV that will be validated against the running DDEV executable
# and prevent add-on from being installed if it doesn't validate.
ddev_version_constraint: '>= v1.24.10'

post_install_actions:
  - |
    #ddev-description:Make custom commands executable
    chmod +x commands/web/* commands/host/* 2>/dev/null || true
  - |
    #ddev-description:Warn when watcher ports are still bound on the host
    watch_file=""
    if [ -f .ddev/docker-compose.watch.yaml ]; then
      watch_file=".ddev/docker-compose.watch.yaml"
    elif [ -f docker-compose.watch.yaml ]; then
      watch_file="docker-compose.watch.yaml"
    fi
    if [ -n "${watch_file}" ] && grep -Eq '9998:9998|9997:9997|5173:5173|9996:9996' "${watch_file}"; then
      echo "Hinweis: ${watch_file} bindet Watcher-Ports direkt auf dem Host."
      echo "Diese Datei entfernen, sonst kollidiert sie mit den Ports aus config.watch.yaml."
    fi
