# #ddev-generated
# ddev-router binds each host port once and selects the project by hostname,
# so several Shopware projects can use the same container ports.
# The HTTPS ports stay on the Shopware defaults. Each HTTP port must differ
# because the router serves only one scheme per port.
web_environment:
  - HOST=0.0.0.0
  - STOREFRONT_SKIP_SSL_CERT=true
web_extra_exposed_ports:
  - name: admin-watch
    container_port: 5173
    http_port: 5172
    https_port: 5173
  - name: storefront-proxy
    container_port: 9998
    http_port: 19998
    https_port: 9998
  - name: storefront-assets
    container_port: 9999
    http_port: 19999
    https_port: 9999
  - name: image-proxy
    container_port: 9996
    http_port: 19996
    https_port: 9996
